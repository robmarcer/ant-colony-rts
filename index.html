<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ant Colony RTS</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">Ant Colony RTS</span>
      <label>A <select id="defA"></select></label>
      <label>B <select id="defB"></select></label>
      <label>seed <input id="seed" value="1" size="6" /></label>
      <label>limit <input id="limit" value="90000" size="6" />s</label>
      <button id="newMatch" class="primary">New match</button>
      <span class="spacer"></span>
      <label>past <select id="pastMatch"><option value="">-</option></select></label>
      <label class="check"><input type="checkbox" id="showIntel" /> intel</label>
      <label>fog
        <select id="fogView">
          <option value="-1">off</option>
          <option value="0">as A sees it</option>
          <option value="1">as B sees it</option>
        </select>
      </label>
      <a id="changelogLink" class="version" href="/changelog.html" title="Opens beside the match, which keeps running">
        <span id="versionNumber">v0.0.0</span> changelog
      </a>
      <a id="instructionsLink" class="version" href="/instructions.html" title="The brief to paste into an LLM">
        instructions
      </a>
      <button id="updateBadge" class="update-badge" hidden></button>
    </header>

    <main class="match">
      <section class="stage">
        <canvas id="canvas"></canvas>
        <div class="controls">
          <button id="playPause">Pause</button>
          <span class="speeds">
            <button data-speed="1">1x</button>
            <button data-speed="2">2x</button>
            <button data-speed="5">5x</button>
            <button data-speed="20">20x</button>
            <button data-speed="max">max</button>
          </span>
          <button id="restart">Restart</button>
          <span class="zoomers">
            <button id="zoomOut" title="Zoom out">&minus;</button>
            <span id="zoomLevel" class="clock">1.0x</span>
            <button id="zoomIn" title="Zoom in">+</button>
            <button id="zoomReset" title="Fit the whole map">fit</button>
          </span>
          <div class="progress"><div id="progressFill"></div></div>
          <span id="clock" class="clock">0s</span>
        </div>
      </section>

      <aside class="side">
        <div id="panelA" class="panel"></div>
        <div id="panelB" class="panel"></div>
        <div class="panel log">
          <h3>Event log</h3>
          <p class="hint">Rule activations, strategy changes and major events. No LLM is consulted during a match.</p>
          <ol id="eventLog"></ol>
        </div>
      </aside>
    </main>

    <div id="summary" class="summary hidden"></div>
    <aside id="docsPanel" class="docs-panel hidden" aria-live="polite"></aside>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
